name: Retraining and Monitoring Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "train/**"
      - "test/**"
      - "src/**"
      - "params.yaml"
      - "dvc.yaml"
      - ".github/workflows/train.yml"

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  retrain-and-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC remote
        run: |
          dvc remote modify origin auth basic
          dvc remote modify origin user ${{ secrets.DAGSHUB_USERNAME }}
          dvc remote modify origin password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull DVC data
        run: dvc pull --allow-missing

      - name: Run DVC retraining and monitoring pipeline
        run: dvc repro

      - name: Show DVC pipeline graph
        run: dvc dag

      - name: Show metrics
        run: |
          dvc metrics show
          dvc metrics diff HEAD~1 || echo "No previous metrics to compare"

      - name: Push DVC outputs
        run: dvc push

      - name: Upload model, metrics, and monitoring reports
        uses: actions/upload-artifact@v4
        with:
          name: retraining-monitoring-results
          path: |
            models/best_model.joblib
            metrics.json
            metrics.txt
            model_results.png
            artifacts/processed_train.csv
            artifacts/model_results.png
            monitoring/reports/drift_report.json
            monitoring/alerts/alerts.json
            monitoring/logs/monitoring.log