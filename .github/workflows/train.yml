name: DVC MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure DVC remote
        run: |
          dvc remote modify origin auth basic
          dvc remote modify origin user ${{ secrets.DAGSHUB_USERNAME }}
          dvc remote modify origin password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull DVC data
        run: dvc pull

      - name: Run DVC pipeline
        run: dvc repro

      - name: Push DVC outputs
        run: dvc push

      - name: Show DVC metrics
        run: |
          dvc metrics show
          dvc metrics diff HEAD~1 || echo "No previous metrics to compare"

      - name: Upload model and results
        uses: actions/upload-artifact@v4
        with:
          name: model-results
          path: |
            models/best_model.joblib
            metrics.json
            metrics.txt
            model_results.png
            artifacts/model_results.png