stages:
  generate_new_data:
    # Generate synthetic new data for testing the retraining pipeline
    cmd: python3 src/generate_new_data.py
    deps:
      - src/generate_new_data.py
      - params.yaml
      - train/train.csv
    outs:
      - data/new_data.csv

  preprocess:
    # Combine old training data with new data and prepare it for retraining
    cmd: python3 src/preprocess_new_data.py
    deps:
      - src/preprocess_new_data.py
      - params.yaml
      - train/train.csv
      - data/new_data.csv
    outs:
      - artifacts/processed_train.csv

  monitor:
    # Run data quality checks and drift detection
    cmd: python3 src/monitor.py
    deps:
      - src/monitor.py
      - params.yaml
      - train/train.csv
      - data/new_data.csv
    outs:
      # Monitoring reports are not cached because they are logs/reports
      - monitoring/reports/drift_report.json:
          cache: false
      - monitoring/alerts/alerts.json:
          cache: false
      - monitoring/logs/monitoring.log:
          cache: false

  train:
    # Train or skip retraining based on the monitoring report
    cmd: python3 src/model.py
    deps:
      - src/model.py
      - params.yaml
      - artifacts/processed_train.csv
      - monitoring/reports/drift_report.json
    outs:
      - models/best_model.joblib

  evaluate:
    # Evaluate the trained model using the test dataset
    cmd: python3 src/evaluate.py
    deps:
      - src/evaluate.py
      - params.yaml
      - test/test.csv
      - models/best_model.joblib
    metrics:
      # Store model evaluation metrics for DVC tracking
      - metrics.json:
          cache: false
    outs:
      # Save evaluation reports and result images
      - metrics.txt:
          cache: false
      - model_results.png:
          cache: false
      - artifacts/model_results.png:
          cache: false